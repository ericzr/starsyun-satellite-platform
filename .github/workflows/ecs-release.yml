name: Build ECS release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build production frontend and server
        run: npm run build:production
        env:
          STARSYUN_DEPLOY_TARGET: ecs

      - name: Smoke-test self-hosted server
        run: npm run smoke:server

      - name: Release preflight
        run: npm run check:release

      - name: Package release
        run: tar -czf "starsyun-${GITHUB_SHA}.tar.gz" dist dist-server package.json scripts supabase/migrations deploy/systemd deploy/nginx

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: starsyun-${{ github.sha }}
          path: starsyun-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30
