limit_req_zone $binary_remote_addr zone=starsyun_api:10m rate=30r/s;

# Bootstrap this HTTP vhost first, then run:
# certbot --nginx -d starsyun.com -d www.starsyun.com --redirect
# Certbot will add and maintain the TLS server configuration.
server {
    listen 80;
    listen [::]:80;
    server_name starsyun.com www.starsyun.com;

    server_tokens off;
    client_max_body_size 2m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location /api/ {
        limit_req zone=starsyun_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
